<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiro_v21.0: Happy Birthday!</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="wishes.css?v=1.2">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
    
</head>
<body>
    <header>
        <ul class="nav justify-content-end p-2">
            <li class="nav-item"><a class="nav-link" href="index.html">​🏠 Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">✨ Meet Hiro</a></li>
            <li class="nav-item"><a class="nav-link" href="wishes.html">🎈 Wishes</a></li>
            <li class="nav-item"><a class="nav-link active" href="countdown.html">⏳Countdown</a></li>
        </ul>
    </header>
    <div class="wishes-container">
        
        <div class="wish-form-section">
            <div class="form-card">
                <h2>Leave a Wish </h2>
                <p class="form-subtitle">Share your favorite memory or wish for Hiro!</p>
                
                <form id="wishForm">
                    <div class="input-group">
                        <label>Your Name</label>
                        <input type="text" id="senderName" placeholder="Who are you? :" required>
                    </div>

                    <div class="input-group">
                        <label>Your Wish</label>
                        <textarea id="wishMessage" rows="4" placeholder="Write something sweet..." required></textarea>
                    </div>

                    <div class="input-group">
                        <label for="imageUpload" class="custom-file-upload">
                            📸 Upload a Photo
                        </label>
                        <input type="file" id="imageUpload" accept="image/*">

                        <div id="fileStatus" class="file-status">No photo selected</div>
                    </div>

                    <button type="submit" class="submit-btn">Send Wish </button>
                </form>
            </div>
        </div>

        <div class="wish-gallery-section">
            <h2 class="gallery-title">Wishes Board</h2>
            <div class="gallery-grid" id="galleryGrid">
                </div>
        </div>

    </div>
    <div class="modal fade" id="wishModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px; border: none; background-color: #f7ffff; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
            <div class="modal-header" style="border-bottom: 1px solid #d2fbfd; padding: 15px 20px;">
                <h5 class="modal-title" id="modalSenderName" style="color: #173358; font-weight: 600; font-size: 18px;">From Someone</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center" style="padding: 25px 20px;">
                <img id="modalImage" src="" alt="Memory" style="width: 80%; max-height: 250px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                
                <p id="modalMessage" style="font-family: 'Caveat', cursive; font-size: 24px; color: #232323; line-height: 1.4; word-wrap: break-word; white-space: pre-line; padding: 0 10px;">
                    Wish message goes here...
                </p>
            </div>
        </div>
    </div>
</div>

    <script type="module" src="wishes.js"></script>
</body>
</html>
