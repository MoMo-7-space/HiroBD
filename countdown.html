
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="countdown.css">
</head>
<body>

    <header>
        <ul class="nav justify-content-end p-2">
            <li class="nav-item"><a class="nav-link" href="index.html">​🏠 Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">✨ Meet Hiro</a></li>
            <li class="nav-item"><a class="nav-link" href="wishes.html">🎈 Wishes</a></li>
            <li class="nav-item"><a class="nav-link active" href="countdown.html">⏳Countdown</a></li>
        </ul>
    </header>

    <div class="bubble-wrapper">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble-3 bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="countdown-container">
        <h1 class="countdown-title">Waiting For <span class="fav-day">Our Favourite Day</span></h1>
        
        <div class="countdown-display">
            <div class="time-block">
                <span class="time-number" id="days">00</span>
                <span class="time-label">Days</span>
            </div>
            <span class="time-colon">:</span>
            
            <div class="time-block">
                <span class="time-number" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <span class="time-colon">:</span>
            
            <div class="time-block">
                <span class="time-number" id="minutes">00</span>
                <span class="time-label">Mins</span>
            </div>
            <span class="time-colon">:</span>
            
            <div class="time-block">
                <span class="time-number" id="seconds">00</span>
                <span class="time-label">Secs</span>
            </div>
        </div>
    </div>

    <script type="module" src="countdown.js"></script>
</body>
